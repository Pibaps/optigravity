[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "optigravity"
version = "0.2.0"
description = "Token efficiency, context health, routing, and telemetry companion for Google Antigravity CLI (agy)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]
tui = [
    "textual>=8.0.0",
    "agent-client-protocol>=1.0.0",
]
subagents = [
    "optigravity[mcp]",
    "google-genai[aiohttp]",
    "keyring",
]
all = [
    "optigravity[mcp,tui,subagents]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]

[project.scripts]
ogy = "ogy_cli.main:main"
ogy-hook = "ogy_hooks.cli:main"
ogy-mcp = "ogy_mcp.server:main"
ogy-subagents = "ogy_subagents.server:main"

[tool.hatch.build.targets.wheel]
packages = [
    "ogy_core",
    "ogy_cli",
    "ogy_hooks",
    "ogy_statusline",
    "ogy_mcp",
    "ogy_subagents",
    "ogy_frontends",
]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "ogy_cli/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
